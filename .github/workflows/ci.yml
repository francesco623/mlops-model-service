name: ci

on:
    push:
        
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: download repo
              uses: actions/checkout@v4

            - name: run tests
              run: docker compose run --rm test

    smoke:
        needs: test 
        runs-on: ubuntu-latest

        steps:
            - name: download repo
              uses: actions/checkout@v4

            - name: build api stage and start container
              run: docker compose up -d --build api

            - name: curl to verify it works
              run: | 
                    curl -X POST "http://localhost:8000/predict" \
                    -H "Content-Type: application/json" \
                    -d '{"pclass": 1, "age": 29, "sibsp": 0, "parch": 0, "fare": 100, "sex": 1}' \
                    --retry 10 --retry-all-errors --retry-delay 2 --fail

            - name: show api logs on failure
              if: failure()
              run: docker compose logs api

            - name: cleanup
              if: always()
              run: docker compose down
              
        